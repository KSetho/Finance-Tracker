[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is supplied by migrations/env.py (from DATABASE_URL) unless set programmatically.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
